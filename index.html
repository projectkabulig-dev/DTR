<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-DTR | Attendance and Daily Time Record</title>
<meta name="theme-color" content="#F3F5FB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --ink:#0F172A; --mute:#64748B; --brand:#2563EB; --brand-d:#1D4ED8; --brand-2:#6D5EF6; --brand-soft:#EEF3FF;
  --bg:#F3F5FB; --paper:#FFFFFF; --line:#E2E8F0; --out:#F97316; --out-d:#EA580C; --out-soft:#FFF3E6;
  --ok:#16A34A; --ok-soft:#E8F8EE; --err:#DC2626; --err-bg:#FEECEC; --r:16px;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 10px 30px rgba(15,23,42,.07);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);
  background:radial-gradient(900px 360px at 50% -120px,#DDE5FF 0%,rgba(221,229,255,0) 70%),var(--bg);min-height:100vh}
h1,h2,h3,.display{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-weight:800;letter-spacing:-.02em;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid #93B4FF;outline-offset:2px}
.hidden{display:none!important}

/* top bar */
.top{background:rgba(255,255,255,.86);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);
  color:var(--ink);padding:10px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.top .brand{font-weight:800;font-size:20px;letter-spacing:-.03em;display:flex;align-items:center;gap:9px;white-space:nowrap;flex:none}
.top .brand:before{content:"";width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-2));box-shadow:0 4px 12px rgba(37,99,235,.35)}
.top .who{margin-left:auto;text-align:right;line-height:1.25;min-width:0}
.top .who b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.top .who span{font-size:12.5px;color:var(--mute);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.top .iconbtn{background:var(--paper);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:600}
.top .iconbtn:hover{background:var(--brand-soft);border-color:#C7D6FF}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;position:sticky;top:0;z-index:5;background:rgba(243,245,251,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tabs button{background:transparent;border:0;border-radius:999px;padding:8px 16px;white-space:nowrap;cursor:pointer;color:var(--mute);font-weight:700;font-size:15px}
.tabs button:hover{background:#E8EDF9;color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.tabs .sep{width:1px;background:var(--line);margin:8px 4px}

main{max-width:980px;margin:0 auto;padding:12px 16px 40px}
.card{background:var(--paper);border:1px solid rgba(226,232,240,.9);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
.muted{color:var(--mute)}
.small{font-size:14px}

/* buttons / forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;min-height:44px;box-shadow:0 6px 16px rgba(37,99,235,.25)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--brand-soft);border-color:#C7D6FF;filter:none}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
label{display:block;font-weight:700;font-size:13.5px;margin:0 0 5px;color:#334155}
.field{margin-bottom:12px}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],select{width:100%;min-height:46px;border:1px solid #CBD5E1;border-radius:12px;padding:8px 12px;background:#fff}
input:focus,select:focus{border-color:var(--brand);outline:3px solid rgba(37,99,235,.18);outline-offset:0}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 180px}
.err{background:var(--err-bg);color:var(--err);border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:15px;font-weight:600}
.note{background:var(--out-soft);border-radius:12px;padding:12px 14px;font-size:15px}

/* login */
.login{max-width:420px;margin:36px auto}
.login h1{font-size:32px;margin-bottom:4px}

/* clock + punch */
.hero{text-align:center;padding:14px 0 6px}
.clock{font-weight:800;font-size:clamp(44px,12vw,72px);line-height:1.02;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:#0F172A}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .clock{background:linear-gradient(180deg,#0F172A 30%,#475569);-webkit-background-clip:text;background-clip:text;color:transparent}
}
.date{color:var(--mute);margin-top:4px;font-weight:600}
.tznote{font-size:13px;color:var(--mute)}
.ring{position:relative;width:min(80vw,300px);aspect-ratio:1;margin:20px auto 12px}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.ring .punch{position:absolute;inset:15%;border-radius:50%;border:0;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--brand),var(--brand-2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 14px 34px rgba(79,70,229,.40)}
.ring .punch:hover{filter:brightness(1.07)}
.ring .punch:active{transform:scale(.98)}
.ring .punch.out{background:linear-gradient(145deg,#FB923C,var(--out-d));box-shadow:0 14px 34px rgba(234,88,12,.38)}
.ring .punch:disabled{background:#CBD5E1;box-shadow:none;cursor:not-allowed}
.punch b{font-weight:800;font-size:clamp(26px,8vw,34px);line-height:1.1;letter-spacing:-.02em}
.punch span{font-size:14px;opacity:.95;padding:0 12px;line-height:1.25;font-weight:600}
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:440px;margin:10px auto 0;text-align:left}
.slot{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}
.slot small{display:block;color:var(--mute);font-size:13px;font-weight:600}
.slot strong{font-size:19px;font-variant-numeric:tabular-nums}
.slot.in.done{border-color:#B9CCFF;background:var(--brand-soft)}
.slot.out.done{border-color:#FFD0A6;background:var(--out-soft)}
.slot.next{outline:2px dashed #94A3B8;outline-offset:2px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
table.t{border-collapse:collapse;width:100%;font-size:15px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;white-space:nowrap}
table.t th{background:#F8FAFC;font-weight:700;color:#475569}
table.t tr:last-child td{border-bottom:0}
table.dtr td,table.dtr th{text-align:center;padding:7px 8px;border:1px solid var(--line)}
table.dtr td.rem{font-style:italic}
table.dtr tfoot td{font-weight:800;background:#F8FAFC}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.bar>div{flex:1 1 170px}
.bar .actions{display:flex;gap:8px;flex:0 0 auto}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;background:var(--ok-soft);color:#15803D}
.pill.off{background:#EEF2F7;color:var(--mute)}

/* modal sheet */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:22px;max-height:92vh;overflow:auto;box-shadow:0 -10px 40px rgba(15,23,42,.18)}
@media(min-width:600px){.scrim{align-items:center}.sheet{border-radius:22px}}
.sheet h2{font-size:22px;margin-bottom:10px}
.sheet .acts{display:flex;gap:10px;margin-top:16px}
.sheet .acts>*{flex:1}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;z-index:30;max-width:92vw;text-align:center;font-weight:600;box-shadow:0 10px 30px rgba(15,23,42,.3)}
#toast.bad{background:var(--err)}
#toast.good{background:var(--ok)}

/* kiosk */
.kiosk{max-width:600px;margin:0 auto;text-align:center}
.kiosk .field{text-align:left}
.kiosk{padding-bottom:20px}
#kf input{font-size:22px;min-height:56px}
.kbtn{width:100%;font-size:24px;min-height:64px;margin-top:4px}
.kres{margin:16px 0;padding:16px;border-radius:16px;border:2px solid var(--line)}
.kres.ok{background:var(--ok-soft);border-color:#86D7A5}
.kres.warn{background:var(--out-soft);border-color:#FFC999;color:#9A3412}
.kres .mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px;font-size:12.5px;color:var(--mute)}
.kres .mini div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 4px}
.kres .mini b{display:block;color:var(--ink);font-size:14.5px;font-variant-numeric:tabular-nums}
.duo{display:flex;gap:clamp(18px,5vw,44px);justify-content:center;flex-wrap:wrap;margin:26px 0 12px}
.orb{position:relative;width:min(42vw,230px);min-width:150px;aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.orb b{font-weight:800;font-size:clamp(24px,5vw,34px);letter-spacing:-.02em;line-height:1.1}
.orb span{font-size:14px;font-weight:600;opacity:.95}
.orb.in{background:linear-gradient(145deg,var(--brand),var(--brand-2));box-shadow:0 0 0 10px rgba(37,99,235,.10),0 14px 34px rgba(79,70,229,.40)}
.orb.out{background:linear-gradient(145deg,#FB923C,var(--out-d));box-shadow:0 0 0 10px rgba(249,115,22,.12),0 14px 34px rgba(234,88,12,.38)}
.chip{margin:14px auto 0;max-width:460px;padding:10px 14px;border-radius:12px;background:#EEF2F7;font-size:14.5px;text-align:center}
.chip.ok{background:var(--ok-soft);color:#166534}
.chip.warn{background:var(--out-soft);color:#9A3412}
.chip a{font-weight:700;color:inherit;text-decoration:underline;cursor:pointer;margin-left:6px}
.duo.phone{margin:18px 0 10px}
.duo.phone .orb{width:min(40vw,170px);min-width:130px}
.duo.phone .orb b{font-size:clamp(22px,5vw,28px)}
.orb:disabled{opacity:.55;cursor:not-allowed;filter:grayscale(.3)}
.orb:hover{filter:brightness(1.06)}
.orb:active{transform:scale(.98)}
.kres.bad{background:var(--err-bg);border-color:var(--err);color:var(--err)}
.kres .g{font-weight:800;font-size:clamp(24px,6vw,34px);line-height:1.15;letter-spacing:-.02em}
.kres .d{margin-top:6px;font-size:18px}
/* print form (CSC Form 48): half of A4 (lengthwise), two copies on one A4 portrait page */
#printSheet{display:none}
.pw{display:flex;width:198mm;height:285mm;margin:0 auto;overflow:hidden}
.pw .cut{flex:none;border-left:.3mm dashed #666;margin:0 2.8mm}
.pf{width:96mm;flex:none;font-family:Arial,Helvetica,sans-serif;color:#000;font-size:7.5pt}
.pf .fn{font-size:6.5pt;font-weight:700;height:4mm;line-height:4mm}
.pf h1{font:700 12pt Arial,Helvetica,sans-serif;text-align:center;letter-spacing:0;height:8mm;line-height:8mm;margin:0}
.pf .nm{border-bottom:.3mm solid #000;text-align:center;font-weight:700;font-size:10pt;height:6mm;line-height:6mm;white-space:nowrap;overflow:hidden}
.pf .cap{text-align:center;font-style:italic;font-size:6.5pt;height:3.5mm;line-height:3.5mm}
.pf .ln{display:flex;height:4.5mm;line-height:4.5mm;font-size:7.5pt;white-space:nowrap}
.pf .ln.m{height:5mm;line-height:5mm}
.pf .ln i{flex:1;border-bottom:.3mm solid #000;font-style:normal;text-align:center;margin-left:1.5mm}
.pf table{border-collapse:collapse;width:96mm;margin-top:2mm;table-layout:fixed}
.pf th,.pf td{border:.3mm solid #000;text-align:center;padding:0;height:5.2mm;font-size:7.5pt;line-height:1;white-space:nowrap;overflow:hidden}
.pf thead th{font-weight:700;height:5mm;font-size:7pt}
.pf tfoot td{font-weight:700;height:5.5mm}
.pf td.rem{font-style:italic}
.pf .cert{font-size:6.5pt;font-style:italic;height:11mm;margin-top:2mm;line-height:1.25;overflow:hidden}
.pf .sg{height:14mm;display:flex;align-items:flex-end}
.pf .sg i{margin-left:30%;flex:1;border-bottom:.3mm solid #000;text-align:center;font-style:normal;font-weight:700;font-size:9pt;white-space:nowrap;overflow:hidden}
.pf .vf{font-size:6.5pt;font-style:italic;height:4mm;line-height:4mm}
.pf .ic{height:14mm;display:flex;align-items:flex-end}
.pf .ic b{margin-left:30%;flex:1;border-bottom:.3mm solid #000;text-align:center;font-size:9pt;white-space:nowrap;overflow:hidden}
.pf .icc{margin-left:30%;text-align:center;font-style:italic;font-size:7.5pt;height:4.5mm;line-height:4.5mm}
.pf .see{font-size:6pt;font-style:italic;height:5mm;margin-top:3mm}
@media print{
  @page{size:A4 portrait;margin:6mm}
  body>*:not(#printSheet){display:none!important}
  #printSheet{display:block}
  html,body{background:#fff}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* ============================================================
   SETTINGS: put the Web app URL from Apps Script here
   ============================================================ */
// When this page is opened directly from the Apps Script web app, API_URL is NOT needed.
// It is only needed if index.html is hosted somewhere else (e.g. GitHub Pages).
const API_URL = 'https://script.google.com/macros/s/AKfycbzF_IepT9sbU7N43fZBEJySbvxVh6wCF6s3NS2wkVdEMFcZIXpy92MLTsYpes77ZVZN/exec';
const EXCEL_LIBS = [
  'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'
];

// <<DTR_BUILDER  (no DOM here; used for the Excel file, print and table)
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const SLOT_INFO = {
  AM_IN:  { kind:'in',  label:'Time In',  sub:'AM Arrival' },
  AM_OUT: { kind:'out', label:'Time Out', sub:'AM Departure' },
  PM_IN:  { kind:'in',  label:'Time In',  sub:'PM Arrival' },
  PM_OUT: { kind:'out', label:'Time Out', sub:'PM Departure' }
};
const SLOT_KEYS = ['AM_IN','AM_OUT','PM_IN','PM_OUT'];
const REQUIRED_MIN = 480; // 8 hours per day; there is no fixed work schedule

function pad2(n){ return String(n).padStart(2,'0'); }
function secOf(t){ if(!t) return null; const p=String(t).split(':').map(Number); return p[0]*3600+(p[1]||0)*60+(p[2]||0); }
function fmt12(t){ if(!t) return ''; const p=String(t).split(':').map(Number); const ap=p[0]>=12?'PM':'AM'; return (p[0]%12||12)+':'+pad2(p[1])+' '+ap; }
function dim(y,m){ return new Date(Date.UTC(y,m,0)).getUTCDate(); }
function dow(y,m,d){ return new Date(Date.UTC(y,m-1,d)).getUTCDay(); }

function computeDtr(d){
  const y=d.year, m=d.month, n=dim(y,m); let total=0;
  const rows=d.days.slice(0,31).map(x=>{
    const hasTime=!!(x.amIn||x.amOut||x.pmIn||x.pmOut);
    const nonexistent=x.day>n;
    const wd=dow(y,m,x.day), off=nonexistent||wd===0||wd===6;
    let ut=null;
    if(!off&&hasTime){
      let secs=0;
      if(x.amIn&&x.amOut) secs+=Math.max(0,secOf(x.amOut)-secOf(x.amIn));
      if(x.pmIn&&x.pmOut) secs+=Math.max(0,secOf(x.pmOut)-secOf(x.pmIn));
      ut=Math.max(0,REQUIRED_MIN-Math.round(secs/60));
      total+=ut;
    }
    let label='';   // written across the AM/PM cells when there are no times: remarks, or SATURDAY/SUNDAY
    if(!hasTime&&!nonexistent) label=x.remarks||(wd===6?'SATURDAY':wd===0?'SUNDAY':'');
    return Object.assign({},x,{off,nonexistent,hasTime,ut,label});
  });
  return {rows,total};
}

function buildDtrWorkbook(ExcelJS, d){
  const wb=new ExcelJS.Workbook();
  wb.creator='E-DTR';
  wb.calcProperties={fullCalcOnLoad:true};
  drawDtrSheet(wb,d,'DTR');
  return wb;
}

// The DTR is half of an A4 sheet (lengthwise). Two copies sit side by side on one A4 portrait page; cut in the middle.
function drawDtrSheet(wb,d,title){
  const calc=computeDtr(d), FIRST=12, LAST=42, TOTAL=43, FONT='Arial';
  const COPIES=2, STRIDE=9, HELP0=18;   // copy 2 starts at column J; hidden helper columns are R and S
  const ws=wb.addWorksheet(title,{views:[{showGridLines:false}]});
  const thin={style:'thin',color:{argb:'FF000000'}};
  const BOX={top:thin,left:thin,bottom:thin,right:thin};
  const L=n=>String.fromCharCode(64+n);   // 1 -> A
  [5,8,8,8,8,6,6].forEach((w,i)=>{ for(let k=0;k<COPIES;k++) ws.getColumn(1+k*STRIDE+i).width=w; });
  ws.getColumn(8).width=1.5; ws.getColumn(9).width=1.5;
  for(let k=0;k<COPIES;k++){ ws.getColumn(HELP0+k).width=14; ws.getColumn(HELP0+k).hidden=true; }
  const rowH={1:12,2:6,3:24,4:6,5:18,6:11,7:16,8:12,9:12,10:14,11:22,43:18,44:6,45:12,46:12,47:12,48:12,49:12,50:20,51:12,52:12,53:12,54:20,55:12,56:6,57:10};
  for(let r=1;r<=57;r++) ws.getRow(r).height=(r>=FIRST&&r<=LAST)?15:(rowH[r]||12);
  for(let r=1;r<=57;r++) ws.getCell(r,9).border={left:{style:'dashed',color:{argb:'FF808080'}}};   // cutting guide

  const drawCopy=k=>{
    const c=i=>L(1+k*STRIDE+i);
    const A=c(0),B=c(1),C=c(2),D=c(3),E=c(4),F=c(5),G=c(6),HP=L(HELP0+k);
    const eachCell=(rng,fn)=>{
      const m=/^([A-Z])(\d+):([A-Z])(\d+)$/.exec(rng);
      for(let r=+m[2];r<=+m[4];r++) for(let q=m[1].charCodeAt(0)-64;q<=m[3].charCodeAt(0)-64;q++) fn(ws.getCell(r,q));
    };
    const put=(addr,val,font,align)=>{
      const cell=ws.getCell(addr); cell.value=val;
      cell.font=Object.assign({name:FONT,size:9},font||{});
      if(align) cell.alignment=align;
      return cell;
    };
    const CENTER={horizontal:'center',vertical:'middle',wrapText:true};
    const underline=rng=>eachCell(rng,x=>{ x.border={bottom:thin}; });
    const merge=rng=>ws.mergeCells(rng);

    put(`${A}1`,'Civil Service Form No. 48',{size:7,bold:true});
    merge(`${A}3:${G}3`); put(`${A}3`,'DAILY TIME RECORD',{size:14,bold:true},CENTER);
    merge(`${A}5:${G}5`); put(`${A}5`,String(d.teacher.name||'').toUpperCase(),{size:11,bold:true},CENTER); underline(`${A}5:${G}5`);
    merge(`${A}6:${G}6`); put(`${A}6`,'(Name)',{size:7,italic:true},CENTER);
    merge(`${A}7:${B}7`); put(`${A}7`,'For the month of',{size:8});
    merge(`${C}7:${G}7`);
    const mc=put(`${C}7`,new Date(Date.UTC(d.year,d.month-1,1)),{size:10,bold:true},CENTER); mc.numFmt='mmmm yyyy'; underline(`${C}7:${G}7`);
    merge(`${A}8:${D}8`); put(`${A}8`,'Official hours for arrival  (Regular days)',{size:7});
    merge(`${E}8:${G}8`); underline(`${E}8:${G}8`);
    merge(`${A}9:${D}9`); put(`${A}9`,'and departure  (Saturdays)',{size:7});
    merge(`${E}9:${G}9`); put(`${E}9`,'-',{size:7},CENTER); underline(`${E}9:${G}9`);

    merge(`${A}10:${A}11`); put(`${A}10`,'Day',{size:8,bold:true},CENTER);
    merge(`${B}10:${C}10`); put(`${B}10`,'A.M.',{size:8,bold:true},CENTER);
    merge(`${D}10:${E}10`); put(`${D}10`,'P.M.',{size:8,bold:true},CENTER);

// <<VOICE_LOGIC  (no DOM here)
const NAME_SUFFIX=/^(JR|SR|II|III|IV|V)\.?$/i;
// "CANDIDO, ROGELIO JR. B." -> "Rogelio"; "REYES, MARIA CRISTINA L." -> "Maria Cristina"
function firstName(full){
  const raw=String(full||'').trim();
  const part=raw.includes(',')?raw.split(',').slice(1).join(',').trim():raw;
  const t=part.split(/\s+/).filter(Boolean);
  while(t.length>1&&NAME_SUFFIX.test(t[t.length-1])) t.pop();
  if(t.length>1&&/^[A-Za-z\u00D1\u00F1]\.?$/.test(t[t.length-1])) t.pop();
  while(t.length>1&&NAME_SUFFIX.test(t[t.length-1])) t.pop();
  const cap=w=>w.toLowerCase().replace(/(^|[-'])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
  return t.map(cap).join(' ');
}
// mode 'en' (default): all greetings in English.
// mode 'fil': AM In / PM In / AM Out in Filipino, PM Out in English.
function greeting(slot,name,hasCallName,mode){
  const fil=mode==='fil', t=hasCallName?'':'teacher ';
  switch(slot){
    case 'AM_IN':  return fil?{lang:'fil',text:'Magandang umaga, '+t+name+'.'}:{lang:'en',text:'Good morning, '+t+name+'.'};
    case 'PM_IN':  return fil?{lang:'fil',text:'Magandang hapon, '+name+'.'}:{lang:'en',text:'Good afternoon, '+name+'.'};
    case 'AM_OUT': return fil?{lang:'fil',text:'Paalam at ingat ka, '+name+'.'}:{lang:'en',text:'Goodbye and take care, '+name+'.'};
    case 'PM_OUT': return {lang:'en',text:'Goodbye and take care, '+name+'.'};
  }
  return {lang:'en',text:name+'.'};
}

const STATUS_TYPES_UI=['TRAVEL ORDER','SICK LEAVE','VACATION LEAVE','SPECIAL LEAVE','OFFICIAL BUSINESS','OTHER'];
// distance in meters between two GPS points (haversine); the server checks again
function distM(lat1,lng1,lat2,lng2){
  const R=6371000, rad=Math.PI/180, dLat=(lat2-lat1)*rad, dLng=(lng2-lng1)*rad;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(a)));
}

/* ---------- Philippine time (Asia/Manila) from the server offset ---------- */
const manilaFmt=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Manila',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
function manilaParts(ms){ const o={}; manilaFmt.formatToParts(new Date(ms)).forEach(p=>{ o[p.type]=p.value; }); return {y:+o.year,m:+o.month,d:+o.day,h:+o.hour%24,mi:+o.minute,s:+o.second}; }
const nowMs=()=>Date.now()+state.offset;
function manilaTime(){ const p=manilaParts(nowMs()); return pad2(p.h)+':'+pad2(p.mi)+':'+pad2(p.s); }
function manilaDate(){ const p=manilaParts(nowMs()); return p.y+'-'+pad2(p.m)+'-'+pad2(p.d); }
function longDate(){ const p=manilaParts(nowMs()); const w=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][dow(p.y,p.m,p.d)]; return `${w}, ${MONTHS[p.m-1]} ${p.d}, ${p.y}`; }

// same rule as nextSlot_ on the server; the server still decides
function nextSlotLocal(rec){
  if(!rec) return {slot:'AM_IN'};
  const p=manilaParts(nowMs()), min=p.h*60+p.mi;
  if(min<720){ if(!rec.AM_IN) return {slot:'AM_IN'}; if(!rec.AM_OUT) return {slot:'AM_OUT'}; return {slot:null}; }
  if(rec.AM_IN&&!rec.AM_OUT&&!rec.PM_IN&&min<750) return {slot:'AM_OUT'};
  if(!rec.PM_IN) return {slot:'PM_IN'};
  if(!rec.PM_OUT) return {slot:'PM_OUT'};
  return {slot:'PM_OUT',update:true};
}

const usingGas=()=>!!(window.google&&window.google.script&&window.google.script.run);
async function api(action,payload={}){
  const body=Object.assign({action,token:state.token},payload);
  let data;
  try{
    if(usingGas()){
      // the page is hosted by Apps Script itself: direct server call, no URL needed
      data=await new Promise((res,rej)=>{
        window.google.script.run.withSuccessHandler(r=>{ try{ res(JSON.parse(r)); }catch(e){ rej(e); } }).withFailureHandler(rej).apiCall(JSON.stringify(body));
      });
    }else{
      if(API_URL.indexOf('PASTE_')===0) return {ok:false,error:'API_URL is not set. Put the Web app URL in index.html.'};
      const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
      data=await res.json();
    }
  }catch(e){
    return {ok:false,error:'Cannot reach the server. Check your internet connection and try again.'};
  }
  if(!data.ok&&data.code==='SESSION'){ localLogout(); toast('Your session expired. Please sign in again.','bad'); }
  if(data.now&&data.now.ms) state.offset=data.now.ms-Date.now();
  return data;
}

/* ---------- location (GPS) ---------- */
function getPos(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation) return rej({code:0});
    navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:15000,maximumAge:0});
  });
}
function locProblem(e){
  if(e&&e.code===1) return 'Location access was blocked. Allow location for this site in your browser settings, then try again.';
  if(e&&e.code===3) return 'Could not get your location in time. Move to an open area and try again.';
  if(usingGas()) return 'Location is not available in this view. Open the app from the website link instead.';
  return 'Could not get your location. Make sure location is turned on and try again.';
}
async function checkChip(){
  const chip=$('#locChip'); if(!chip) return;
  const g=state.geo||{}, sc=g.school, strict=g.mode==='strict';
  const again=()=>{ const a=$('#locAgain'); if(a) a.onclick=e=>{ e.preventDefault(); checkChip(); }; };
  const tail=strict?'':' You can still time in or out; the entry will be marked "not verified".';
  if(!g.mode||g.mode==='off'){ chip.className='chip hidden'; return; }
  if(!sc){
    chip.className=strict?'chip warn':'chip';
    chip.textContent=strict?'The location of your school has not been set yet. Please ask the admin to set it.':'Your school has no GPS area yet, so your location is not checked. You can still time in or out; the entry will be marked "not verified".';
    return;
  }
  chip.className='chip'; chip.textContent='Checking your location...';
  try{
    const pos=await getPos(), d=distM(pos.coords.latitude,pos.coords.longitude,sc.lat,sc.lng), acc=Math.round(pos.coords.accuracy||0);
    const c=$('#locChip'); if(!c) return;
    if(acc>g.maxAcc){ c.className='chip warn'; c.innerHTML=`The GPS signal is weak (about ${acc} m).${esc(tail)} <a href="#" id="locAgain">Check again</a>`; }
    else if(d<=sc.radius){ c.className='chip ok'; c.innerHTML=`You are inside ${esc(sc.name)} (about ${Math.round(d)} m from the center). <a href="#" id="locAgain">Check again</a>`; }
    else { c.className='chip warn'; c.innerHTML=`You are about ${Math.round(d)} m from ${esc(sc.name)}. You must be within ${sc.radius} m to time in or out from a phone. <a href="#" id="locAgain">Check again</a>`; }
    again();
  }catch(e){
    const c=$('#locChip'); if(!c) return;
    c.className='chip warn'; c.innerHTML=`${esc(locProblem(e))}${esc(tail)} <a href="#" id="locAgain">Try again</a>`; again();
  }
}

/* ---------- phone punch ---------- */
async function phonePunch(intent){
  const bi=$('#pIn'), bo=$('#pOut'); if(!bi) return;
  bi.disabled=bo.disabled=true;
  try{ const AC=window.AudioContext||window.webkitAudioContext; if(AC){ actx=actx||new AC(); if(actx.state==='suspended') actx.resume(); } }catch(e){}
  let pos=null;
  const mode=(state.geo&&state.geo.mode)||'off';
  if(mode!=='off'){
    try{ pos=await getPos(); }
    catch(e){
      if(mode==='strict'){ if($('#pIn')) bi.disabled=bo.disabled=false; chime('bad'); showKiosk('bad',`<div class="g">${esc(locProblem(e))}</div>`); return; }
      // 'flag' mode: continue without a location; the server records it as "not verified"
    }
  }
  const r=await api('punch',Object.assign({intent},pos?{lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy}:{}));
  if(!$('#pIn')) return;

  if(r.ok&&state.today){ state.today.rec=r.rec; const sb=$('#slotsBox'); if(sb) sb.innerHTML=slotCards(r.rec); }

}

/* ---------- DTR (monthly) ---------- */
function monthOptions(){
  const p=manilaParts(nowMs()), out=[]; let y=p.y, m=p.m;
  for(let i=0;i<12;i++){ out.push([y+'-'+pad2(m),`${MONTHS[m-1]} ${y}`]); m--; if(m===0){ m=12; y--; } }
  return out;
}
// The month counts as finished once its last working day (Monday to Friday) is reached. Used for the warning only.
function monthDone(y,m){
  let d=dim(y,m);
  while(d>1&&(dow(y,m,d)===0||dow(y,m,d)===6)) d--;
  const p=manilaParts(nowMs());
  return p.y*10000+p.m*100+p.d >= y*10000+m*100+d;
}
function guardUnfinished(done,fn){
  if(done){ fn(); return; }
  const s=openSheet(`<h2>The month is not finished yet</h2>
    <p>This DTR is incomplete and the undertime may change while new time in/outs are still being recorded. Continue with the download or print?</p>
    <div class="acts"><button class="btn ghost" id="gx">Cancel</button><button class="btn" id="gy">Continue</button></div>`);
  $('#gx',s).onclick=closeSheet;
  $('#gy',s).onclick=()=>{ closeSheet(); fn(); };
}

      <div><label for="dm">Month</label><select id="dm">${monthOptions().map(o=>`<option value="${o[0]}"${state.dtrMonth===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select></div>

async function loadDtr(){

  if(!r.ok){ $('#dbody').innerHTML=`<p class="err">${esc(r.error)}</p>`; return; }
  state.dtr=r;
  const calc=computeDtr(r), done=monthDone(y,m);
  const rows=calc.rows.map(x=>{
    const cells=x.label
      ? `<td colspan="4"${x.remarks?' class="rem"':''}>${esc(x.label)}</td>`
      : [x.amIn,x.amOut,x.pmIn,x.pmOut].map(t=>`<td>${fmt12(t)}</td>`).join('');
    return `<tr><td>${x.day}</td>${cells}<td>${x.ut==null?'':Math.floor(x.ut/60)}</td><td>${x.ut==null?'':x.ut%60}</td></tr>`;
  }).join('');
  $('#dbody').innerHTML=`

      <tbody>${rows}</tbody>
      <tfoot><tr><td colspan="5">TOTAL</td><td>${Math.floor(calc.total/60)}</td><td>${calc.total%60}</td></tr></tfoot></table></div>
    <p class="small muted" style="margin:10px 0 0">In Charge: ${r.inCharge?esc(r.inCharge):'<i>not set for this school yet</i>'}</p>
    ${done?'':`<p class="note" style="margin-top:10px">The month is not finished yet. You can download or print now, but the DTR is incomplete and the undertime may still change.</p>`}`;
  const dx=$('#dx'), dp=$('#dp');

}
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function ensureExcelJS(){
  if(window.ExcelJS) return window.ExcelJS;
  for(const src of EXCEL_LIBS){ try{ await loadScript(src); if(window.ExcelJS) return window.ExcelJS; }catch(e){} }
  throw new Error('Could not load the Excel library. Check your internet connection and try again.');
}
async function downloadExcel(){
  const d=state.dtr; if(!d) return;
  const b=$('#dx'); b.disabled=true; b.textContent='Preparing...';
  try{
    const X=await ensureExcelJS();
    const buf=await buildDtrWorkbook(X,d).xlsx.writeBuffer();
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`DTR_${d.teacher.empNo}_${d.year}-${pad2(d.month)}.xlsx`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('DTR downloaded. Print it on A4 and sign.','good');
  }catch(e){ toast(e.message,'bad'); }
  b.disabled=false; b.textContent='Download Excel';
}

    <div class="bar"><div><label for="fe">Teacher</label><select id="fe"><option value="">Select...</option>${(state.teachers||[]).filter(t=>t.active&&t.role!=='Kiosk').map(t=>`<option value="${esc(t.empNo)}"${state.fix.emp===t.empNo?' selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
      <div><label for="fd">Date</label><input id="fd" type="date" value="${esc(state.fix.date)}"></div>
      <div class="actions"><button class="btn ghost" id="fl">Load</button></div></div>
    <div id="fbody"></div></div>`;
  const load=async()=>{
    state.fix.emp=$('#fe').value; state.fix.date=$('#fd').value;
    if(!state.fix.emp||!state.fix.date){ toast('Select an employee and a date.','bad'); return; }
    const r=await api('day',{empNo:state.fix.emp,date:state.fix.date});
    if(!r.ok){ toast(r.error,'bad'); return; }
    const x=r.rec, t=k=>esc(x[k]?x[k].slice(0,8):'');
    $('#fbody').innerHTML=`<div class="row">${SLOT_KEYS.map(k=>`<div class="field"><label for="f_${k}">${SLOT_INFO[k].sub}</label><input id="f_${k}" type="time" step="1" value="${t(k)}"></div>`).join('')}</div>
      <div class="field"><label for="f_rem">Remarks (e.g. LEAVE, HOLIDAY, TRAVEL ORDER)</label><input id="f_rem" type="text" maxlength="60" value="${esc(x.remarks)}"></div>
      <button class="btn" id="fs">Save changes</button>`;
    $('#fs').onclick=async()=>{
      const res=await api('editDay',{empNo:state.fix.emp,date:state.fix.date,amIn:$('#f_AM_IN').value,amOut:$('#f_AM_OUT').value,pmIn:$('#f_PM_IN').value,pmOut:$('#f_PM_OUT').value,remarks:$('#f_rem').value});
      toast(res.ok?'Changes saved.':res.error,res.ok?'good':'bad');
    };
  };
  $('#fl').onclick=load;
  if(state.fix.emp) load();
}

/* ---------- SOUND: chime and voice ---------- */
const snd={on:true,vol:1,fil:'',en:'',greet:'en'};
try{ Object.assign(snd,JSON.parse(localStorage.getItem('dtr_sound')||'{}')); }catch(e){}
const saveSnd=()=>{ try{ localStorage.setItem('dtr_sound',JSON.stringify(snd)); }catch(e){} };
const synth=()=>('speechSynthesis' in window)?window.speechSynthesis:null;
const allVoices=()=>{ const s=synth(); return s?(s.getVoices()||[]):[]; };
function pickVoice(lang){
  const vs=allVoices(), saved=snd[lang];
  if(saved){ const v=vs.find(x=>x.voiceURI===saved||x.name===saved); if(v) return v; }
  const rank=v=>/natural|online/i.test(v.name)?0:1;
  const by=re=>vs.filter(v=>re.test(v.lang)).sort((a,b)=>rank(a)-rank(b))[0]||null;
  if(lang==='fil') return by(/^(fil|tl)([-_]|$)/i);
  return by(/^en[-_]PH/i)||by(/^en[-_]US/i)||by(/^en/i);
}
function speak(text,lang){
  const s=synth();
  if(!snd.on||!s||!window.SpeechSynthesisUtterance) return;
  try{
    s.cancel();
    const u=new window.SpeechSynthesisUtterance(text), v=pickVoice(lang);
    if(v){ u.voice=v; u.lang=v.lang; } else u.lang=lang==='fil'?'fil-PH':'en-PH';
    u.volume=snd.vol; u.rate=0.95;
    s.speak(u);
  }catch(e){}
}
let actx=null;
function chime(kind){   // 'in' rising, 'out' falling, 'bad' low
  if(!snd.on) return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    actx=actx||new AC(); if(actx.state==='suspended') actx.resume();
    const seq=kind==='in'?[659,880]:kind==='out'?[880,659]:[196,196], t0=actx.currentTime;
    seq.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain(), a=t0+i*0.18;
      o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001,a); g.gain.exponentialRampToValueAtTime(0.25*snd.vol+0.0001,a+0.02); g.gain.exponentialRampToValueAtTime(0.0001,a+0.17);
      o.start(a); o.stop(a+0.18);
    });
  }catch(e){}
}
function openSound(){
  const vs=allVoices(), fil=vs.filter(v=>/^(fil|tl)([-_]|$)/i.test(v.lang)), en=vs.filter(v=>/^en/i.test(v.lang));
  const opts=(list,sel)=>'<option value="">Auto</option>'+list.map(v=>`<option value="${esc(v.voiceURI||v.name)}"${(sel===v.voiceURI||sel===v.name)?' selected':''}>${esc(v.name)}</option>`).join('');
  const s=openSheet(`<h2>Sound</h2>
    <div class="field"><label><input type="checkbox" id="sn" ${snd.on?'checked':''} style="width:auto;min-height:0;margin-right:8px">Sound and voice greeting on</label></div>
    <div class="field"><label for="sv">Volume</label><input id="sv" type="range" min="0.1" max="1" step="0.1" value="${snd.vol}" style="min-height:0"></div>
    <div class="field"><label for="sg">Greeting language</label><select id="sg"><option value="en"${snd.greet!=='fil'?' selected':''}>English (default)</option><option value="fil"${snd.greet==='fil'?' selected':''}>Filipino</option></select></div>
    <div class="field"><label for="se">English voice</label><select id="se">${opts(en,snd.en)}</select></div>
    <div class="field"><label for="sf">Filipino voice</label><select id="sf">${opts(fil,snd.fil)}</select></div>
    <p class="note small">${fil.length?'A Filipino voice is available on this device.':'No Filipino voice was found on this device, so Filipino greetings would use an English voice. For a natural Filipino voice, use <b>Microsoft Edge</b> on the kiosk computer.'}</p>
    <div class="acts"><button class="btn ghost" id="t1">Test English</button><button class="btn ghost" id="t2">Test Filipino</button></div>
    <div class="acts"><button class="btn" id="sx">Done</button></div>`);
  const apply=()=>{ snd.on=$('#sn',s).checked; snd.vol=+$('#sv',s).value; snd.greet=$('#sg',s).value; snd.en=$('#se',s).value; snd.fil=$('#sf',s).value; saveSnd(); updateSoundBtn(); };
  ['#sn','#sv','#sg','#se','#sf'].forEach(q=>$(q,s).addEventListener('change',apply));
  $('#t1',s).onclick=()=>{ apply(); chime('in'); setTimeout(()=>speak('Good morning, teacher Rogelio.','en'),420); };
  $('#t2',s).onclick=()=>{ apply(); chime('out'); setTimeout(()=>speak('Magandang umaga, teacher Rogelio.','fil'),420); };
  $('#sx',s).onclick=closeSheet;
}
function updateSoundBtn(){ const b=$('#ksnd'); if(b) b.textContent=snd.on?'Sound: On':'Sound: Off'; }

/* ---------- KIOSK: time in/out at the office ---------- */
function showKiosk(kind,html){   // kind: 'ok' | 'warn' | 'bad'
  const k=$('#kres'); if(!k) return;
  k.className='kres '+kind; k.innerHTML=html;
  clearTimeout(state.kt); state.kt=setTimeout(()=>{ const q=$('#kres'); if(q) q.className='kres hidden'; },8000);
}
let KIOSK_IDLE_MS=30000;   // the form closes itself when nobody touches it
function viewKiosk(){
  const v=$('#view');
  v.innerHTML=`<div class="card kiosk hero">
    <div class="clock" id="clock"></div><div class="date" id="date"></div><div class="tznote">Philippine Standard Time</div>
    <div class="duo">
      <button class="orb in" id="kin" type="button"><b>Time In</b><span>Arrival</span></button>
      <button class="orb out" id="kout" type="button"><b>Time Out</b><span>Departure</span></button>
    </div>
    <div id="kres" class="kres hidden" aria-live="polite"></div>
    <p style="margin:6px 0 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn ghost" id="ksnd" type="button"></button><button class="btn ghost" id="ks" type="button">Voice settings</button></p></div>`;
  tick();
  $('#kin').onclick=()=>openKioskForm('in');
  $('#kout').onclick=()=>openKioskForm('out');
  $('#ks').onclick=openSound;
  updateSoundBtn();
  $('#ksnd').onclick=toggleSound;
  // keep the kiosk signed in while the page is open
  state.hb=setInterval(()=>{ if(state.token) api('ping'); },10*60*1000);
}
function openKioskForm(intent){
  try{ const AC=window.AudioContext||window.webkitAudioContext; if(AC){ actx=actx||new AC(); if(actx.state==='suspended') actx.resume(); } }catch(e){}   // allow sound (needs a click)
  const label=intent==='in'?'Time In':'Time Out', color=intent==='in'?'var(--brand)':'var(--out-d)';
  const s=openSheet(`<h2 style="color:${color}">${label}</h2>
    <p class="err hidden" id="kerr" role="alert"></p>
    <form id="kf" autocomplete="off">
      <div class="field"><label for="ke">Employee number</label><input id="ke" type="text" autocomplete="off" autocapitalize="characters"></div>
      <div class="field"><label for="kp">PIN</label><input id="kp" type="password" inputmode="numeric" autocomplete="off"></div>
      <div class="acts"><button class="btn ghost" id="kx" type="button">Cancel</button><button class="btn" id="kok" type="submit">Record ${label}</button></div>
    </form>`);
  let idle; const bump=()=>{ clearTimeout(idle); idle=setTimeout(()=>{ if($('#kf')) closeSheet(); },KIOSK_IDLE_MS); };
  s.addEventListener('input',bump); bump();
  $('#kx',s).onclick=()=>{ clearTimeout(idle); closeSheet(); };
  $('#ke',s).addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#kp',s).focus(); } });
  const fail=msg=>{ chime('bad'); const e=$('#kerr',s); e.textContent=msg; e.classList.remove('hidden'); $('#kp',s).value=''; $('#kp',s).focus(); };
  $('#kf',s).onsubmit=async e=>{
    e.preventDefault();
    const emp=$('#ke',s).value.trim(), pin=$('#kp',s).value.trim(), b=$('#kok',s);
    if(!emp||!pin){ fail('Enter the employee number and PIN.'); return; }
    b.disabled=true;
    const r=await api('kioskPunch',{empNo:emp,pin,intent});
    if(!$('#kf')) return;
    b.disabled=false;
    if(!r.ok&&!r.person){ fail(r.error); return; }          // wrong PIN, locked, etc.: stay in the form
    clearTimeout(idle); closeSheet();
    showPunchResult(r,r.person);                              // success, or a warning such as "already timed in"
  };
}

/* ---------- start ---------- */
(async function init(){
  render();
  const t0=Date.now(), r=await api('time');
  if(r.ok&&r.now) state.offset=r.now.ms+(Date.now()-t0)/2-Date.now();
  if(state.token&&state.user) tick();
})();
</script>
